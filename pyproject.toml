[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "miradac"
version = "0.1.0"
description = "Python binding of MiraDAC, a differential algebra library in C++"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
# Zero-copy interop needs symengine.py built against the pinned SymEngine
# (scripts/setup_symengine.sh); the PyPI wheel works in string mode only.
symengine = ["symengine==0.14.1"]

[tool.scikit-build]
cmake.build-type = "Release"
# Needed by editable installs with editable.rebuild (the plan's build command).
build-dir = "build-py/{wheel_tag}"
install.components = ["python"]
wheel.packages = ["python/miradac"]

[tool.scikit-build.cmake.define]
WITH_SYMBOLIC = "ON"

[tool.uv]
no-binary-package = ["symengine"]

# Portable Linux wheels: `cibuildwheel --platform linux` (also run by the
# wheels CI workflow). The pinned SymEngine is built inside the manylinux
# image and auditwheel bundles it with GMP, so the wheels need nothing on the
# target machine; symengine.py interop then works through strings only.
[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
# musllinux: not a target; free-threaded CPython: the GIL is never released
# and the DA pools are not thread-safe (plan A.6).
skip = ["*-musllinux_*", "cp31*t-*"]
archs = ["x86_64"]
test-requires = ["pytest", "numpy", "sympy"]
test-command = "pytest {project}/python/tests -q"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = [
    "dnf install -y gmp-devel",
    "scripts/setup_symengine.sh --no-python --prefix /opt/symengine",
]
environment = { SymEngine_DIR = "/opt/symengine/lib/cmake/symengine" }
# build-dir: not the dev build's build-py/, which may be copied in with the project.
config-settings = { "cmake.define.MIRADAC_BUNDLED_SYMENGINE" = "ON", "build-dir" = "/tmp/miradac-build/{wheel_tag}" }

# mypy: symengine.py and sympy ship no type information.
[[tool.mypy.overrides]]
module = ["symengine", "symengine.*", "sympy", "sympy.*"]
ignore_missing_imports = true

# The generated stub mirrors the runtime overloads: an int overload after a
# float one (the order plan A.5 picks for speed), and in-place operators that
# take fewer operand types than the binary ones (x += 1j rebinds x to a CNDA).
[[tool.mypy.overrides]]
module = "miradac._core"
disable_error_code = ["overload-cannot-match", "misc"]
