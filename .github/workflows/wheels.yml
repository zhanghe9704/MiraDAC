name: Wheels

# Portable Linux wheels of the Python package `miradac` (manylinux_2_28
# x86_64, CPython 3.10-3.14), configured in pyproject.toml
# [tool.cibuildwheel]: the pinned SymEngine is built inside the image and
# bundled with GMP by auditwheel, and every wheel runs the Python tests.
#
# Runs on a version tag (v*), which also attaches the wheels and the sdist to
# a GitHub Release, and by hand (workflow_dispatch), which keeps them as
# workflow artifacts only.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  wheels:
    name: Linux wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the sdist
        run: pipx run build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ wheels, sdist ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release with the wheels and the sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
