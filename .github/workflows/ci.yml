name: CI

# Builds and tests both variants of the `da` library and of the Python
# package `miradac`:
#   * numerical-only  (WITH_SYMBOLIC=OFF)  — no external dependencies
#   * numerical+symbolic (WITH_SYMBOLIC=ON) — the pinned SymEngine
#     (cmake/symengine_pin.txt), built by scripts/setup_symengine.sh
#
# Mirrors the exact configure commands used during development so the
# SymEngine-enabled build is reproducible.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  numerical:
    name: Numerical (WITH_SYMBOLIC=OFF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure + build + test (guard ON)
        run: ./build.sh --build-dir build-off --jobs 2

      - name: Tests under AddressSanitizer (leak detection on)
        run: |
          cmake --build build-off --target run_tests_asan -j2
          # Run from test/ so the reference data files resolve.
          cd test && ASAN_OPTIONS=detect_leaks=1 ../build-off/test/run_tests_asan

      - name: Configure + build + test (guard compiled out)
        run: ./build.sh --no-check-env --build-dir build-off-noguard --jobs 2

      - name: Install smoke-test (find_package(da))
        run: |
          cmake --install build-off --prefix "$PWD/_install"
          test -f "$PWD/_install/lib/cmake/da/daConfig.cmake"
          find "$PWD/_install" -maxdepth 3 -name 'libda*' -o -name 'da.h'

      - name: Consumer smoke-test (exported compile definitions)
        run: |
          cmake -S test/consumer -B build-consumer \
            -Dda_DIR="$PWD/_install/lib/cmake/da"
          cmake --build build-consumer -j2
          ./build-consumer/consumer_smoke

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python package, numeric-only build
        run: |
          python -m venv .venv
          .venv/bin/pip install pytest numpy mypy
          .venv/bin/pip install . -Ccmake.define.WITH_SYMBOLIC=OFF
          .venv/bin/pytest python/tests -q

  symbolic:
    name: Symbolic (WITH_SYMBOLIC=ON, pinned SymEngine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libgmp-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache the pinned SymEngine
        uses: actions/cache@v4
        with:
          path: ~/.local/opt
          key: symengine-${{ runner.os }}-${{ hashFiles('cmake/symengine_pin.txt', 'scripts/setup_symengine.sh') }}

      - name: Pinned SymEngine and symengine.py
        run: |
          python -m venv .venv
          # Builds SymEngine (skipped when the cache holds a matching stamp),
          # then symengine.py from source against it, into .venv.
          scripts/setup_symengine.sh --python .venv/bin/python --print-env \
            | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Configure + build + test (symbolic)
        run: |
          ./build.sh --symbolic --symengine-dir "$SymEngine_DIR" \
            --build-dir build-on --jobs 2

      - name: Tests under AddressSanitizer (leak detection on)
        run: |
          cmake --build build-on --target run_tests_asan -j2
          cd test && ASAN_OPTIONS=detect_leaks=1 ../build-on/test/run_tests_asan

      - name: Consumer smoke-test (symbolic install)
        run: |
          cmake --install build-on --prefix "$PWD/_install_on"
          # No SymEngine hint: the installed package config finds the pin.
          cmake -S test/consumer -B build-consumer-on \
            -Dda_DIR="$PWD/_install_on/lib/cmake/da"
          cmake --build build-consumer-on -j2
          ./build-consumer-on/consumer_smoke

      - name: Python package, symbolic build
        run: |
          .venv/bin/pip install nanobind scikit-build-core pytest numpy sympy mypy
          .venv/bin/pip install --no-build-isolation .
          .venv/bin/pytest python/tests -q
